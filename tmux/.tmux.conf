###############################################################################
# Config
###############################################################################
# Set prefix
unbind C-b
set -g prefix C-Space

# Enable extended keys
set -g extended-keys on
set -g extended-keys-format csi-u

# Hide status bar
# set -g status off

# Disable mouse support
setw -g mouse off

# Enable yanking to macOS clipboard
set-option -s set-clipboard on
setw -g mode-keys vi
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle \; send-keys -X begin-selection
bind-key -T copy-mode-vi Escape send-keys -X clear-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear "pbcopy" \; display-message -d 600 "✓ Copied to clipboard"

# Renumber windows after any window is closed
set-option -g renumber-windows on

# Shift-arrow keys to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window
bind-key h previous-window
bind-key l next-window
bind-key o last-window

# Create pane with v/x
bind-key v split-window -h -c "#{pane_current_path}"
bind-key x split-window -v -c "#{pane_current_path}"

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Reload tmux config
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded!"

# Simpler window to show only sessions
bind s choose-session

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Inlined from tmux-sensible
set -g history-limit 50000    # 3.6b default is 2000
set -g display-time 4000      # 3.6b default is 750ms
set -g status-interval 5      # 3.6b default is 15
set -g focus-events on        # 3.6b default off — Neovim autoread / FocusLost
setw -g aggressive-resize on  # 3.6b default off — sane multi-client sizing
bind C-Space send-prefix      # prefix is C-Space, so prefix prefix -> literal C-Space

# Persistent window titles: don't let programs rename the window (allow-rename)
# and don't auto-rename to the running command (automatic-rename), so a window
# keeps its name until you set one with prefix + , (rename-window).
set -g allow-rename off
setw -g automatic-rename off
set -g pane-border-status off
set -g pane-border-format "#[bold, align=centre] #[bg=themeblue, fg=themeblack] #{pane_title} #[default] "
bind-key t set pane-border-status

# Mark and swap panes
## Mark pane
bind m select-pane -m
## Unmark pane
bind M select-pane -M
## Join pane
bind j join-pane -h
# Panes cheatsheet
# prefix !    : break the current pane out of its window (to form new window)
# ctrl d      : exit current shell/window
# prefix o    : cycle location of panes
# prefix f    : prompt to search for text in open windows

# Add quick bindings for backward/forward search
bind / copy-mode \; send-keys gg \; send-keys /
bind ? copy-mode \; send-keys ?

# Sessionizer
bind-key -r f run-shell "tmux new-window ~/.tmux/scripts/tmux-sessionizer"
bind-key -r k run-shell "tmux new-window ~/.tmux/scripts/tmux-terminator"
bind-key -r b run-shell "~/.tmux/scripts/tmux-sessionizer btop"
bind-key -r . run-shell "~/.tmux/scripts/tmux-sessionizer ~/.dotfiles"
# Floating session jumper
# bind j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

###############################################################################
# Theme
###############################################################################

# Enable true color (24-bit) and italics in Alacritty/Kitty + tmux + Neovim
# https://gist.github.com/andersevenrud/015e61af2fd264371032763d4ed965b6
set -g default-terminal "tmux-256color"          # inner TERM programs see; in Nvim's truecolor fallback list
set -as terminal-features ",alacritty:RGB"        # outer Alacritty supports 24-bit RGB
set -as terminal-features ",xterm-256color:RGB"   # robustness: ssh / other emulators

# Undercurls
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Modified TokyoNight theme for tmux
# Original: https://github.com/folke/tokyonight.nvim/blob/main/extras/tmux_tokyonight_night.tmux
#
# The palette lives in tmux 3.8 theme slots, so styles reference it by name
# (themeblue, themered, ...). Names resolve at draw time, not parse time, and
# also recolour tmux's own defaults: tree mode (prefix w), copy-mode search,
# menus, popups, display-panes. Requires tmux >= 3.8.
#
# TokyoNight Night colours, named after tokyonight.nvim's palette keys:
# https://github.com/folke/tokyonight.nvim/blob/main/lua/tokyonight/colors/storm.lua
# %hidden keeps them out of the environment of programs tmux starts. $name is
# expanded outside quotes and inside double quotes, never in single quotes.
%hidden tokyonight_bg='#1a1b26'
%hidden tokyonight_black='#15161e'
%hidden tokyonight_storm_bg_dark='#1f2335'  # Storm's bg_dark, a touch lighter than Night's
%hidden tokyonight_fg_gutter='#3b4261'
%hidden tokyonight_terminal_black='#414868'
%hidden tokyonight_fg_dark='#a9b1d6'
%hidden tokyonight_fg='#c0caf5'
%hidden tokyonight_moon_fg='#c8d3f5'       # Moon's fg: Alacritty's normal white
%hidden tokyonight_blue0='#3d59a1'
%hidden tokyonight_blue='#7aa2f7'
%hidden tokyonight_cyan='#7dcfff'
%hidden tokyonight_cyan_muted='#449dab'    # not TokyoNight: this config's status bar accent
%hidden tokyonight_green='#9ece6a'
%hidden tokyonight_yellow='#e0af68'
%hidden tokyonight_orange='#ff9e64'
%hidden tokyonight_red='#f7768e'
%hidden tokyonight_red1='#db4b4b'
%hidden tokyonight_magenta='#bb9af7'

set -s theme dark                                          # Alacritty only loads TokyoNight Night
set -s dark-theme-black      "$tokyonight_storm_bg_dark"   # status bar, text on accent pills
set -s dark-theme-dark-grey  "$tokyonight_fg_gutter"       # selection, messages, borders
set -s dark-theme-light-grey "$tokyonight_fg_dark"         # inactive window names, status text
set -s dark-theme-white      "$tokyonight_fg"              # menu and popup text
set -s dark-theme-blue       "$tokyonight_blue"
set -s dark-theme-red        "$tokyonight_red"
set -s dark-theme-cyan       "$tokyonight_cyan_muted"
set -s dark-theme-yellow     "$tokyonight_yellow"
set -s dark-theme-green      "$tokyonight_green"
set -s dark-theme-magenta    "$tokyonight_magenta"

set -g mode-style "fg=themeblue,bg=themedarkgrey"

set -g message-style "fg=themeblue,bg=themedarkgrey,fill=themedarkgrey"
set -g message-command-style "fg=themeblue,bg=themedarkgrey,fill=themedarkgrey"

set -g pane-border-style "fg=themedarkgrey"
set -g pane-active-border-style "fg=themered"

# Defaults the trial below overrides. A reload (prefix r) only runs the lines it
# finds, so these restore the defaults when the trial is commented out.
set -g window-style default
set -g window-active-style default
set -g pane-border-indicators colour
set -gu pane-colours

# Show focus by dimming unfocused panes (tmux 3.8 dim=)
# instead of the red half-border. Delete this block to restore the red border.
# dim= darkens every colour of an unfocused pane, background included, so:
# - bg is $tokyonight_bg / 0.6: dim=40 brings it back to $tokyonight_bg, so the
#   background stays put and only text dims. Recompute it if dim= changes.
# - pane-colours mirrors alacritty/tokyonight.toml. Without it tmux dims ANSI
#   colours from its built-in xterm palette (red #800000, not $tokyonight_red).
set -g window-style        'fg=themewhite,bg=#2c2d40,dim=40'  # unfocused: text and colours 40% darker
set -g window-active-style 'fg=terminal,bg=terminal'         # focused: untouched terminal colours
set -g pane-active-border-style "fg=themedarkgrey"            # no red: all borders the same grey
set -g pane-border-indicators off                            # no half-coloured border in 2-pane windows
set -g  pane-colours "$tokyonight_black $tokyonight_red $tokyonight_green $tokyonight_yellow $tokyonight_blue0 $tokyonight_magenta $tokyonight_cyan $tokyonight_moon_fg"  # 0-7 normal
set -ag pane-colours "$tokyonight_terminal_black $tokyonight_red $tokyonight_green $tokyonight_yellow $tokyonight_blue $tokyonight_magenta $tokyonight_cyan $tokyonight_fg"  # 8-15 bright
set -ag pane-colours "$tokyonight_orange $tokyonight_red1"  # 16-17 indexed

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=themeblue,bg=themeblack"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

# Left status is cyan by default, and red while the prefix key is active
%hidden status_module="#{?client_prefix,#[fg=themeblack#,bg=themered],#[fg=themeblack#,bg=themecyan]}#[bold]  #S"
%hidden status_module_separator="#{?client_prefix,#[fg=themered#,bg=themeblack],#[fg=themecyan#,bg=themeblack]}#[nobold,nounderscore,noitalics]"
set -g status-left "$status_module $status_module_separator"

# host_module="#{?pane_in_mode,#[fg=themeyellow#,bg=themeblack],#[fg=themecyan,bg=themeblack,nobold,nounderscore,noitalics]}#{?pane_in_mode,#[fg=themeblack#,bg=themeyellow],#[fg=themeblack,bg=themecyan]}#[bold] @#h "
# date_time_module_left_separator="#[fg=themedarkgrey,nobold,nounderscore,noitalics]"
# date_time_module_right_separator="#[fg=themeblack,bg=themedarkgrey,nobold,nounderscore,noitalics]"
%hidden date_time_module="#[fg=themelightgrey,bg=themeblack] %H:%M ｜ %d-%b-%y #[default]"
%hidden pomodoro_module="#[fg=themelightgrey,bg=themeblack]#{pomodoro_status} #[default]"
# set -g status-right "$date_time_module$host_module"
set -g status-right "$date_time_module$pomodoro_module"

setw -g window-status-activity-style "underscore,fg=themelightgrey,bg=themeblack"
setw -g window-status-bell-style "NONE,fg=themelightgrey,bg=themeblack"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=themelightgrey,bg=themeblack"
setw -g window-status-format "#[fg=themeblack,nobold,nounderscore,noitalics]#[default] #W#{?window_bell_flag,  ,}#{?window_zoomed_flag,  ,} "
setw -g window-status-current-format "#[fg=themeblack,bg=themedarkgrey,nobold,nounderscore,noitalics]#[fg=themeblue,bg=themedarkgrey,bold] #W#{?window_zoomed_flag,  ,} #[fg=themedarkgrey,bg=themeblack,nobold,nounderscore,noitalics]"

###############################################################################
# Plugins
###############################################################################
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'olimorris/tmux-pomodoro-plus'

# Restore pane contents with tmux-resurrect
set -g @resurrect-capture-pane-contents 'off'

# Restore neovim session (if one exists)
set -g @resurrect-strategy-nvim 'session'

# Last saved environment is automatically restored when tmux is started
set -g @continuum-restore 'on'

# Automatically save environment every 5 minutes
set -g @continuum-save-interval '5'

# Show continuum status
# set -g status-right 'Continuum status: #{continuum_status}'

###############################################################################
# Pomodoro settings
###############################################################################
set -g @pomodoro_toggle 'p'                    # Start/pause a Pomodoro/break
set -g @pomodoro_cancel 'P'                    # Cancel the current session
set -g @pomodoro_skip '_'                      # Skip a Pomodoro/break

set -g @pomodoro_mins 25                       # The duration of the Pomodoro
set -g @pomodoro_break_mins 5                  # The duration of the break after the Pomodoro completes
set -g @pomodoro_intervals 4                   # The number of intervals before a longer break is started
set -g @pomodoro_long_break_mins 25            # The duration of the long break
set -g @pomodoro_repeat 'off'                  # Automatically repeat the Pomodoros?
set -g @pomodoro_disable_breaks 'off'          # Turn off breaks

set -g @pomodoro_on "#[fg=themered]#[bg=themered,fg=themeblack]  "                      # The formatted output when the Pomodoro is running
set -g @pomodoro_complete "#[fg=themecyan]#[bg=themecyan,fg=themeblack]  "     # The formatted output when the break is running
set -g @pomodoro_pause "#[fg=themelightgrey]#[bg=themelightgrey,fg=themeblack]  "              # The formatted output when the Pomodoro/break is paused
set -g @pomodoro_prompt_break "#[fg=themeyellow]#[bg=themeyellow,fg=themeblack]  break?"      # The formatted output when waiting to start a break
set -g @pomodoro_prompt_pomodoro "#[fg=themeyellow]#[bg=themeyellow,fg=themeblack]  start?"   # The formatted output when waiting to start a Pomodoro

set -g @pomodoro_menu_position "R"             # The location of the menu relative to the screen
set -g @pomodoro_sound 'Sosumi'                # Sound for desktop notifications (Run `ls /System/Library/Sounds` for a list of sounds to use on Mac)
set -g @pomodoro_notifications 'on'            # Enable desktop notifications from your terminal
set -g @pomodoro_interval_display " [%s/%s]"

# Timer granularity
set -g @pomodoro_granularity 'off'
# set -g @pomodoro_granularity 'on'              # Enables MM:SS (ex: 00:10) format instead of the default (ex: 1m)
# set -g status-interval 1                       # Refresh the status line every second

###############################################################################
###############################################################################

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/tpm/tpm'
